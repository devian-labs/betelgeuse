[package]
name = "betelgeuse"
version = "0.2.1"
description = "Block-based notes on plain Markdown + git, open to AI agents over MCP"
authors = ["Devian Labs and contributors"]
license = "MIT"
repository = "https://github.com/devian-labs/betelgeuse"
edition = "2021"

[lib]
name = "betelgeuse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
walkdir = "2"
dirs = "6"
csv = "1"
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
scraper = { version = "0.27", default-features = false }
tauri-plugin-opener = "2"
ureq = "3"
