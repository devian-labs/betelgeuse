[package]
name = "betelgeuse-core"
version = "0.1.0"
description = "The workspace engine shared by the Betelgeuse apps: Markdown pages, frontmatter, databases, links, trash and git"
authors = ["Devian Labs and contributors"]
license = "MIT"
repository = "https://github.com/devian-labs/betelgeuse"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
# Git without the `git` program, for the phone apps (see git_lib.rs). Desktop keeps the CLI.
git2 = { version = "0.21", optional = true, default-features = false, features = ["https", "vendored-libgit2"] }
# Installing plugins and the plugin store (desktop and mobile apps).
ureq = { version = "3", optional = true }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
ed25519-dalek = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }

[features]
libgit2 = ["dep:git2"]
plugins = ["dep:ureq", "dep:zip", "dep:ed25519-dalek", "dep:sha2", "dep:hex", "dep:base64"]
