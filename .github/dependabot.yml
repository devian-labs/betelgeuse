version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Security fixes arrive as one PR, not one per package.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # Major versions can break things: one PR for all of them, to review on its own.
      npm-major:
        applies-to: version-updates
        update-types: [major]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # Major versions can break things: one PR for all of them, to review on its own.
      cargo-major:
        applies-to: version-updates
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
