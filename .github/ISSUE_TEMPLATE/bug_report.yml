name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a page
        2. Type /table
        3. …
  - type: input
    attributes:
      label: Version and OS
      description: The version is in Settings → About.
      placeholder: Betelgeuse 0.5.1, macOS 15.3 (Apple Silicon)
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Where did it happen?
      options:
        - Desktop app, downloaded from GitHub Releases
        - Desktop app, built from source
        - Android app
        - iOS app (built from source)
        - Web app (app.betelgeuse.pro)
        - Web demo (app.betelgeuse.pro/demo)
        - Web app, self-hosted
        - MCP server / AI agents
        - Website (betelgeuse.pro)
    validations:
      required: true
