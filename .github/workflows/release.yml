# Builds the app for macOS, Linux and Windows when a version tag (v0.1.0, …) is pushed,
# and attaches the files to a draft GitHub release.
#
# The builds are NOT signed with an Apple Developer ID or a Windows certificate. macOS builds are
# ad-hoc signed, so they run, but Gatekeeper warns on first launch: see the release notes below.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci && npm --prefix mcp ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Betelgeuse ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## Install

            **The easiest and safest way is to build it yourself**: it takes one command and avoids every warning below.
            See [Install from source](https://github.com/devian-labs/betelgeuse#install-from-source).

            These downloads are not signed with an Apple or Microsoft certificate yet (that costs money; [sponsoring](https://github.com/sponsors/devian-labs) helps).

            - **macOS** (`aarch64` for Apple Silicon, `x64` for Intel): open the `.dmg` and drag Betelgeuse to Applications.
              The first time, macOS says it "can't verify the developer". Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
              Or run once in Terminal: `xattr -dr com.apple.quarantine /Applications/Betelgeuse.app`
            - **Windows**: run the `.exe` installer. If SmartScreen appears, click **More info → Run anyway**.
            - **Linux**: `.AppImage` (make it executable and run it) or `.deb` (`sudo apt install ./betelgeuse_*.deb`).

            The MCP server for AI agents needs **Node.js 20+**.
