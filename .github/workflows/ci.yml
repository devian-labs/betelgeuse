name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-and-mcp:
    name: Typecheck and tests (desktop frontend, MCP server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @betelgeuse/desktop -w betelgeuse-mcp
      - run: node --import tsx --test tests/*.test.mjs
        working-directory: apps/desktop
      - run: npm test -w betelgeuse-mcp

  lander:
    name: Landing page build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @betelgeuse/lander

  rust:
    name: Rust tests and clippy
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # The app embeds the built frontend and bundles the MCP server, so build both first.
      - run: npm ci
      - run: npm run mcp:build && npx vite build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
