name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

# A new push to a pull request cancels its older run. Runs on main (and releases) always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
      lander: ${{ steps.diff.outputs.lander }}
      rust: ${{ steps.diff.outputs.rust }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Each job below runs only when something it checks has changed. A skipped job counts as
      # passing, so required checks don't block. Releases (and their dry runs) check everything.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set_all() { for k in web lander rust; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; echo "android=$1" >> "$GITHUB_OUTPUT"; }
          if [ "$EVENT" != pull_request ] && { [ "$EVENT" != push ] || [[ "$REF" == refs/tags/* ]]; }; then
            # A release or a release dry run: run every check. The release builds Android itself.
            echo "Release: running every check"; set_all false; exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # No usable base (first push, force-push): check everything to be safe.
            echo "No base to compare with: running every check"; set_all true; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          ci='|^\.github/workflows/ci\.yml$'
          has() { grep -qE "$1" <<< "${2:-$files}" && echo true || echo false; }
          # The TypeScript job ignores the Rust shells, except the two files its tests read.
          web_files=$(grep -vE '^apps/(desktop|mobile)/src-tauri/' <<< "$files" || true; grep -E '^apps/desktop/src-tauri/(seed/|src/importer/notion_html\.rs$)' <<< "$files" || true)
          {
            echo "web=$(has "^(apps/desktop/|apps/mobile/|apps/web/|crates/betelgeuse-core/plugin-signing\.pub$|packages/|plugins/|scripts/|package(-lock)?\.json$|tsconfig)$ci" "$web_files")"
            echo "lander=$(has "^(apps/lander/|docs/content/|apps/desktop/src-tauri/seed/|package(-lock)?\.json$)$ci")"
            echo "rust=$(has "^(crates/|apps/desktop/src-tauri/|apps/mobile/src-tauri/|packages/starter-pages/|Cargo\.(toml|lock)$|rust-toolchain)$ci")"
            echo "android=$(has "^(apps/mobile/src-tauri/|apps/mobile/scripts/|apps/mobile/package\.json$|packages/starter-pages/)")"
          } | tee -a "$GITHUB_OUTPUT"

  web-and-mcp:
    name: Typecheck and tests (desktop, mobile and web frontends, MCP server)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next-env.d.ts is written on the first build; the web app's types need it first.
      - run: npx next typegen
        working-directory: apps/web
      - run: npm run typecheck -w @betelgeuse/desktop -w @betelgeuse/mobile -w @betelgeuse/web -w betelgeuse-mcp
      # Every plugin in plugins/ typechecks and builds against the plugin API.
      - run: npm run plugins
      - run: node --import tsx --test tests/*.test.mjs
        working-directory: apps/desktop
      - run: npm test -w betelgeuse-mcp
      - run: npm test -w @betelgeuse/web
      # The release build writes the third-party notices first, through `npm ls`, which fails on a lockfile
      # npm can't fully resolve (v0.5.2's first builds did). Check it here, not at release time.
      - run: node scripts/notices.mjs
        working-directory: apps/desktop
      # Every interface builds, so a UI change is checked without the Rust job.
      - run: npx vite build
        working-directory: apps/desktop
      - run: npx vite build
        working-directory: apps/mobile
      - run: npm run build -w @betelgeuse/web

  lander:
    name: Landing page build
    needs: changes
    if: ${{ needs.changes.outputs.lander == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @betelgeuse/lander

  rust:
    name: Rust tests and clippy
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The Cargo workspace (shared core + app shells) is at the repo root.
      - uses: Swatinem/rust-cache@v2
      # The app embeds the built frontend and bundles the MCP server, so build both first.
      # Install from the repo root: npm ci inside a workspace folder installs only that workspace.
      - run: npm ci
      - run: npm run mcp:build
      - run: npx vite build
        working-directory: apps/desktop
      # The mobile app's crate is in the workspace too, and embeds its own built interface.
      - run: npx vite build
        working-directory: apps/mobile
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Android build
    needs: changes
    # Only when the Android app itself changes; the shared crates are covered by the Rust job, and
    # every release builds and signs the APK.
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      # The same build the release makes, through the wrapper that points OpenSSL at llvm-ranlib.
      - name: Build the APK
        run: npm run android:build -w @betelgeuse/mobile -- --apk
