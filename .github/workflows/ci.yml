name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

jobs:
  web-and-mcp:
    name: Typecheck and tests (desktop frontend, MCP server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @betelgeuse/desktop -w @betelgeuse/mobile -w betelgeuse-mcp
      # Every plugin in plugins/ typechecks and builds against the plugin API.
      - run: npm run plugins
      - run: node --import tsx --test tests/*.test.mjs
        working-directory: apps/desktop
      - run: npm test -w betelgeuse-mcp

  lander:
    name: Landing page build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @betelgeuse/lander

  rust:
    name: Rust tests and clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The Cargo workspace (shared core + app shells) is at the repo root.
      - uses: Swatinem/rust-cache@v2
      # The app embeds the built frontend and bundles the MCP server, so build both first.
      # Install from the repo root: npm ci inside a workspace folder installs only that workspace.
      - run: npm ci
      - run: npm run mcp:build
      - run: npx vite build
        working-directory: apps/desktop
      # The mobile app's crate is in the workspace too, and embeds its own built interface.
      - run: npx vite build
        working-directory: apps/mobile
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Android build
    # Releases build (and sign) the APK in their own job, so not again in their checks.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      # The same build the release makes, through the wrapper that points OpenSSL at llvm-ranlib.
      - name: Build the APK
        run: npm run android:build -w @betelgeuse/mobile -- --apk
